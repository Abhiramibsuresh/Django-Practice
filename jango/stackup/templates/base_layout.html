{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}ArticleHub{% endblock %}
    </title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=20260919">
    <script src="https://unpkg.com/lucide@latest"></script>

</head>


<body>

    <!-- NAVBAR -->

    <header class="navbar">

        <div class="nav-container">

            <a href="{% url 'home' %}" class="logo">

                <img src="{% static 'car.webp' %}" alt="ArticleHub">

                <span>ArticleHub</span>

            </a>


            <nav class="navigation">

                <a href="{% url 'home' %}">
                    Home
                </a>

                <a href="{% url 'codex:list' %}">
                    Articles
                </a>

                <a href="{% url 'about' %}">
                    About
                </a>
                <a href="{% url 'movies' %}">Movies</a>

                {% if user.is_authenticated %}

                    <a href="{% url 'codex:create' %}" class="nav-button">
                        + New Article
                    </a>

                    <form action="{% url 'accounts:logout' %}"
                          method="post"
                          class="logout-form">

                        {% csrf_token %}

                        <button type="submit">
                            Logout
                        </button>

                    </form>

                {% else %}

                    <a href="{% url 'accounts:login' %}">
                        Login
                    </a>

                    <a href="{% url 'accounts:signup' %}"
                       class="signup-button">
                        Sign Up
                    </a>

                {% endif %}

            </nav>

        </div>

    </header>


    <!-- PAGE CONTENT -->

    <main>

        {% block content %}
        {% endblock %}

    </main>


    <!-- FOOTER -->

    <footer class="footer">

        <p>© 2026 ArticleHub</p>

        <p>Share ideas · Inspire others</p>

    </footer>

</body>

</html>
